<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Letter Balloon Game</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/theme.js"></script>
  </head>
  <body class="game-page">
    <div class="theme-control" aria-label="Theme selector">
      <span id="theme-icon" class="theme-icon" aria-hidden="true">🌓</span>
      <span class="label">Theme</span>
      <label for="theme-select" class="sr-only">Theme</label>
      <select id="theme-select" class="theme-select">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <div id="countdown-overlay" role="status" aria-live="assertive">
      <div id="countdown-text">3</div>
    </div>

    <div class="game-shell">
      <nav id="game-info" aria-label="Game stats">
        <div id="difficulty">Difficulty: Normal</div>
        <div id="correct-pops">Correct Pops: 0</div>
        <div id="mistakes">Mistakes/Missed: 0</div>
        <div id="timer">Time: 0:00</div>
        <div id="correct-pops-percentage">Correct Pops Percentage: 0 %</div>
        <div id="score">Score: 0</div>
        <div>
          <button id="new-game-btn" class="btn btn-outline">New Game</button>
        </div>
      </nav>

      <div class="game-main">
        <div id="game-area"></div>
        <section id="keyboard-layer" aria-label="Keyboard helper"></section>
        <section id="fingers-layer" aria-label="Fingers helper"></section>
      </div>
    </div>

    <script type="module" src="/script.js"></script>
  </body>
</html>
